# CI quality gate — secret-free checks: lint + unit tests + production build.
#
# `pnpm build` runs WITHOUT secrets. The db (src/lib/db) and Stripe
# (src/lib/stripe/client) clients are lazily constructed behind Proxies, so
# importing them during "Collecting page data" reads no env, opens no socket,
# and never throws — `next build` succeeds with DATABASE_URL / STRIPE_* /
# UPSTASH_* all unset. Sentry sourcemap upload auto-skips without an auth token.
# This catches the class of latent build-breaks (eager env reads at module
# load) that previously only surfaced on a real Vercel deploy.
#
# Typecheck (`tsc --noEmit`) is a hard gate. The old Next.js validator-type
# artifact (TS2307 against a non-existent page in .next/types) is gone on the
# current Next version — `tsc --noEmit` is clean with or without a prior build,
# because the tsconfig `.next/types/**` globs simply match nothing when absent.

name: CI

on:
  # Feature branches run once, via pull_request. An unfiltered `push:` ran the
  # whole gate a second time on every PR commit.
  push:
    branches: [main]
  pull_request:

# Read-only: this job only lints, tests and builds. The three scheduled
# workflows ask for contents: write because they commit; CI must not.
permissions:
  contents: read

# Four pushes in 30 minutes should not queue four full 3-minute runs.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    name: Lint & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history so the image-size guard can diff against origin/main.
          fetch-depth: 0

      # Version is taken from package.json's `packageManager` field (pnpm@10.33.0).
      # Do NOT also set a `version:` input — pnpm/action-setup@v4 fails the job with
      # "Multiple versions of pnpm specified" when both are present (broke CI on
      # every branch until this was removed).
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      # Match the Vercel project's runtime (nodeVersion 24.x). On Node 20 this
      # gate proved the app builds on a runtime production does not use, and
      # Node 20 went end-of-life in April 2026.
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Lint is ADVISORY for now: the repo has a backlog of pre-existing eslint
      # errors (tracked separately as lint-debt cleanup). Typecheck, test, and build
      # are the hard gates. TODO: flip this to blocking (remove
      # continue-on-error) once the lint backlog is cleared in its own PR.
      - name: Lint (advisory)
        run: pnpm lint
        continue-on-error: true

      - name: Typecheck
        run: pnpm exec tsc --noEmit

      - name: Test
        run: pnpm test

      # Image-size guard — fails if a new/changed jpg/jpeg/png in this branch
      # exceeds 500 KB (SVG/WebP/AVIF exempt). Keeps the deploy image payload
      # from creeping back after the asset diet. Exceptions go in
      # scripts/image-size-allowlist.txt. See scripts/check-image-sizes.mjs.
      - name: Image-size guard
        run: node scripts/check-image-sizes.mjs
        env:
          # On a PR the base is origin/main. On a push to main, origin/main IS
          # the commit just pushed, so `origin/main...HEAD` was empty and the
          # guard inspected nothing — which is every run on this repo, since
          # main is pushed to directly. Diff against the pre-push commit
          # instead; the script falls back to HEAD~1 for a first push (all-zero
          # SHA) or an unresolvable ref.
          BASE_REF: ${{ github.event_name == 'pull_request' && 'origin/main' || github.event.before }}

      # Secret-free production build. Proves the app builds with NO runtime
      # secrets — the lazy db + Stripe Proxies mean module import during page-
      # data collection never reads env or opens a socket. Sentry sourcemap
      # upload auto-skips without SENTRY_AUTH_TOKEN. If this fails, something
      # reintroduced an eager env read / throw at module load.
      - name: Build (secret-free)
        run: pnpm build
