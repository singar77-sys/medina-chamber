# CI quality gate — secret-free checks: lint + unit tests + production build.
#
# `pnpm build` runs WITHOUT secrets. The db (src/lib/db) and Stripe
# (src/lib/stripe/client) clients are lazily constructed behind Proxies, so
# importing them during "Collecting page data" reads no env, opens no socket,
# and never throws — `next build` succeeds with DATABASE_URL / STRIPE_* /
# UPSTASH_* all unset. Sentry sourcemap upload auto-skips without an auth token.
# This catches the class of latent build-breaks (eager env reads at module
# load) that previously only surfaced on a real Vercel deploy.
#
# Typecheck (`tsc --noEmit`) is a hard gate. The old Next.js validator-type
# artifact (TS2307 against a non-existent page in .next/types) is gone on the
# current Next version — `tsc --noEmit` is clean with or without a prior build,
# because the tsconfig `.next/types/**` globs simply match nothing when absent.

name: CI

on:
  # Feature branches run once, via pull_request. An unfiltered `push:` ran the
  # whole gate a second time on every PR commit.
  push:
    branches: [main]
  pull_request:

# Read-only: this job only lints, tests and builds. The three scheduled
# workflows ask for contents: write because they commit; CI must not.
permissions:
  contents: read

# Four pushes in 30 minutes should not queue four full 3-minute runs.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    name: Lint & Test
    runs-on: ubuntu-latest

    steps:
      # Pinned to a full commit SHA, not a mutable major tag: `@v4` is a
      # branch-like ref the action's owner can repoint at any time, so a
      # changed (or compromised) upstream would run here unreviewed. The
      # trailing comment records which release the SHA is, for readers and for
      # bumping. To upgrade: read the release notes, then swap SHA + comment.
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Full history so the image-size guard can diff against origin/main.
          fetch-depth: 0

      # Version is taken from package.json's `packageManager` field (pnpm@10.33.0).
      # Do NOT also set a `version:` input — pnpm/action-setup@v4 fails the job with
      # "Multiple versions of pnpm specified" when both are present (broke CI on
      # every branch until this was removed).
      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      # Match the Vercel project's runtime (nodeVersion 24.x). On Node 20 this
      # gate proved the app builds on a runtime production does not use, and
      # Node 20 went end-of-life in April 2026.
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Dependency vulnerability scan. Deliberately two passes:
      #
      #   1. BLOCKING at `critical`. As of 2026-09-05 the tree has 0 critical
      #      (5 low / 18 moderate / 29 high), so this is green on day one and
      #      only goes red when something genuinely severe lands.
      #   2. REPORTING at `high`, never failing, written to the run summary.
      #      Blocking on `high` today would paint CI permanently red on 29
      #      pre-existing transitive build-chain advisories (6x fast-uri via
      #      @sentry/nextjs -> webpack -> ajv; none on next or sharp). A gate
      #      that is red on every run is a gate everyone learns to ignore,
      #      which is worse than no gate at all.
      #
      # Placed before the slow steps so a new critical advisory fails in
      # seconds rather than after a 3-minute build.
      #
      # What this does NOT catch: an advisory published only as a repo-level
      # GitHub security advisory and never mirrored into the GitHub Advisory
      # Database / OSV. GHSA-2xp9-vwfh-vxw4 (Next.js) is exactly that case,
      # which is why `pnpm audit` reports nothing for it. Registry advisories
      # are this step's half of the coverage; GitHub's own dependency graph and
      # Dependabot alerts are the other half.
      - name: Dependency audit (blocking on critical)
        run: pnpm audit --audit-level=critical

      - name: Dependency audit report (advisory)
        if: always()
        run: |
          # A fenced code block, NOT <pre>. $GITHUB_STEP_SUMMARY is rendered as
          # GitHub-flavoured Markdown WITH HTML, and the sanitizer drops anything
          # that parses as a tag. pnpm audit's output is full of version ranges
          # (">=3.0.0 <3.1.6" — 25 "<" characters in the current output), so
          # inside <pre> the upper bound of every range is silently swallowed and
          # the report renders WRONG rather than merely ugly. A security report
          # that shows the wrong range is worse than one that shows none. Inside
          # a fence the text is literal, "<" included.
          #
          # tail -n 40 keeps the trailing "N vulnerabilities found / Severity:"
          # summary, which is the useful part; the per-advisory table above it is
          # truncated — read the step's own log for the full listing.
          {
            echo "### pnpm audit — advisory, does not fail the build"
            echo '```text'
            pnpm audit --audit-level=high 2>&1 | tail -n 40 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Lint is ADVISORY for now: the repo has a backlog of pre-existing eslint
      # errors (tracked separately as lint-debt cleanup). Typecheck, test, and build
      # are the hard gates. TODO: flip this to blocking (remove
      # continue-on-error) once the lint backlog is cleared in its own PR.
      - name: Lint (advisory)
        run: pnpm lint
        continue-on-error: true

      - name: Typecheck
        run: pnpm exec tsc --noEmit

      - name: Test
        run: pnpm test

      # Image-size guard — fails if a new/changed raster in this branch exceeds
      # 500 KB or 3000 px on the long edge. Covers jpg/jpeg/png/webp/avif; only
      # SVG is exempt. WebP/AVIF used to be exempt as "already optimized", which
      # confused the format with the work — an un-resized camera frame is a
      # megabyte in any format, and 75 tracked .webp files were over the byte
      # limit when the check was widened (grandfathered in the allowlist).
      # Keeps the deploy image payload from creeping back after the asset diet.
      # Exceptions go in scripts/image-size-allowlist.txt.
      # See scripts/check-image-sizes.mjs.
      - name: Image-size guard
        run: node scripts/check-image-sizes.mjs
        env:
          # On a PR the base is origin/main. On a push to main, origin/main IS
          # the commit just pushed, so `origin/main...HEAD` was empty and the
          # guard inspected nothing — which is every run on this repo, since
          # main is pushed to directly. Diff against the pre-push commit
          # instead; the script falls back to HEAD~1 for a first push (all-zero
          # SHA) or an unresolvable ref.
          BASE_REF: ${{ github.event_name == 'pull_request' && 'origin/main' || github.event.before }}

      # Secret-free production build. Proves the app builds with NO runtime
      # secrets — the lazy db + Stripe Proxies mean module import during page-
      # data collection never reads env or opens a socket. Sentry sourcemap
      # upload auto-skips without SENTRY_AUTH_TOKEN. If this fails, something
      # reintroduced an eager env read / throw at module load.
      - name: Build (secret-free)
        run: pnpm build
