# Daily data refresh — events, member news, jobs.
#
# These three datasets change frequently:
#   - events.json:      new events posted weekly, dates roll forward
#   - member-news.json: members post announcements multiple times a week
#   - jobs.json:        members post + close jobs throughout the week
#
# We scrape, commit any diff, push to main, Vercel auto-deploys.
# No diff = no commit = no deploy. Quiet on quiet days.
#
# Manual run: GitHub → Actions → "Daily data refresh" → "Run workflow"

name: Daily data refresh

on:
  schedule:
    # 05:00 UTC = 1 AM ET / midnight CDT. Deep off-peak window — well
    # away from the 12:30–13:00 UTC slot where GitHub's receive-pack
    # was rejecting our pushes with "fatal error in commit_refs" (runs
    # #36, #38, #39 all died there). GH Actions cron is best-effort
    # and can drift 2+ hours during peak, so picking 05:00 UTC keeps
    # the actual firing comfortably outside the bad window.
    - cron: "0 5 * * *"
  workflow_dispatch: {}

permissions:
  contents: write   # needed to commit + push the JSON updates

concurrency:
  group: scrape-daily
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: .   # repo root IS the site root

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          # Need full token so the push at the end can trigger Vercel.
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup pnpm
        # Version comes from package.json `packageManager` (pnpm@10.33.0); do NOT
        # add a `version:` input — pnpm/action-setup@v4 aborts on the conflict.
        uses: pnpm/action-setup@v4

      # Node 24 matches the Vercel project runtime (nodeVersion 24.x);
      # Node 20 went end-of-life in April 2026.
      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Scrape events
        id: events
        run: pnpm scrape:events
        continue-on-error: true   # one scraper failing shouldn't block the others

      - name: Scrape member news
        id: news
        run: pnpm scrape:news
        continue-on-error: true

      - name: Scrape jobs
        id: jobs
        run: pnpm scrape:jobs
        continue-on-error: true

      # Smoke check — refuse to push an empty events file.
      # If GrowthZone changes their HTML and we silently scrape zero
      # events, the homepage event widget would go dark. Better to fail
      # the workflow loudly so a human investigates.
      - name: Smoke check — scraped counts must be sane
        id: smoke
        run: |
          # The continue-on-error flags above mean a scraper can write a
          # collapsed file and the workflow still shows green — so every
          # dataset is checked here, not just events. News/jobs can
          # legitimately be small, so they are compared against the
          # previously committed file instead of a fixed floor.
          #
          # Collapse handling differs by dataset. events.json going empty is
          # always a break (the chamber always has upcoming events), so it
          # blocks the push. The jobs board and member news legitimately drain
          # to zero, and the scrapers already exit 1 WITHOUT writing on a real
          # break (listing HTTP error, >20% detail failures) — so a zero there
          # is recorded and reported AFTER the push instead of blocking it.
          # Otherwise the first genuinely empty jobs board would stop events
          # and news reaching the site, every day, until someone posted a job.
          COLLAPSED=""
          check () {
            file=$1; key=$2; floor=$3; on_collapse=$4
            count=$(node -e "console.log(JSON.parse(require('fs').readFileSync('src/data/'+process.argv[1],'utf8'))[process.argv[2]].length)" "$file" "$key")
            prev=$(git show "HEAD:src/data/$file" 2>/dev/null | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>{try{console.log(JSON.parse(d)[process.argv[1]].length)}catch{console.log(0)}})" "$key")
            echo "$file: $count entries (previously $prev)"
            if [ "$count" -lt "$floor" ]; then
              echo "❌ $file has $count entries (floor: $floor). Refusing to push — investigate scraper."
              exit 1
            fi
            if [ "$prev" -gt 0 ] && [ "$count" -eq 0 ]; then
              if [ "$on_collapse" = "block" ]; then
                echo "❌ $file collapsed from $prev entries to zero. Refusing to push — investigate scraper."
                exit 1
              fi
              echo "⚠️  $file collapsed from $prev entries to zero — pushing the other datasets, then failing this run so it gets looked at."
              COLLAPSED="${COLLAPSED}${COLLAPSED:+, }$file ($prev → 0)"
            fi
          }
          check events.json events 5 block
          check member-news.json articles 0 report
          check jobs.json jobs 0 report
          echo "collapsed=$COLLAPSED" >> "$GITHUB_OUTPUT"

      - name: Show diff (for log visibility)
        run: |
          echo "=== Files changed ==="
          git status --short
          echo ""
          echo "=== Summary ==="
          git diff --stat src/data/ || true

      - name: Commit + push if anything changed
        id: push
        run: |
          if git diff --quiet src/data/; then
            echo "No data changes — nothing to commit."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/events.json src/data/member-news.json src/data/jobs.json
          git commit -m "chore(data): daily scrape — $(date -u +%Y-%m-%d)

          Auto-refresh of events, member news, and jobs from GrowthZone.
          Triggered by .github/workflows/scrape-daily.yml."

          # GitHub's git-receive-pack has been intermittently returning
          # "fatal error in commit_refs" on this repo during peak hours
          # (see runs #36/#38/#39 — every one died here while off-peak
          # dispatches pushed cleanly). Retry with exponential backoff
          # before giving up, and rebase against origin/main between
          # attempts so we don't get stuck behind anything that landed
          # during the wait.
          for attempt in 1 2 3; do
            if git push origin main; then
              echo "✓ Push succeeded on attempt $attempt"
              exit 0
            fi
            case "$attempt" in
              1) delay=10 ;;
              2) delay=30 ;;
              *) delay=0 ;;
            esac
            if [ "$delay" -gt 0 ]; then
              echo "Push attempt $attempt failed; sleeping ${delay}s before retry"
              sleep "$delay"
              echo "Rebasing against origin/main in case anything landed during the wait"
              git pull --rebase origin main || { echo "❌ Rebase failed; aborting"; exit 1; }
            fi
          done
          echo "❌ Push failed after 3 attempts. See receive-pack errors above."
          exit 1

      # Surface a jobs/news collapse AFTER the push, so today's events and news
      # still reach the site while the run still goes red (same pattern as the
      # weekly workflow's blog step). A zero is usually genuine — verify the
      # GrowthZone listing has no cards before assuming the scraper broke.
      - name: Report a dataset that collapsed to zero
        # always(): a plain `if:` implies success(), so a failed push would hide
        # the one message that explains what went wrong.
        if: always() && steps.smoke.outputs.collapsed != ''
        run: |
          echo "❌ Collapsed to zero: ${{ steps.smoke.outputs.collapsed }}"
          echo "Check https://business.medinachamber.com — if the listing really is empty, this run needs no action."
          exit 1

      # A scraper that REFUSES to write is now the healthy failure mode: the
      # listing guards added to scrape-news/scrape-jobs exit 1 without touching
      # src/data when GrowthZone serves an error page or the listing markup
      # moves. That leaves yesterday's data intact, which is what we want, but
      # it also means the smoke check above sees count == prev and passes, and
      # continue-on-error swallows the exit code. Without this step the run goes
      # green while the data quietly freezes — the exact way member-ratings.json
      # went stale from June 2026 with every weekly run green.
      - name: Fail loudly if a scraper broke
        if: always() && (steps.events.outcome == 'failure' || steps.news.outcome == 'failure' || steps.jobs.outcome == 'failure')
        run: |
          echo "❌ A scraper exited non-zero. Whatever it could not scrape is now STALE, not empty:"
          echo "  events: ${{ steps.events.outcome }}"
          echo "  news:   ${{ steps.news.outcome }}"
          echo "  jobs:   ${{ steps.jobs.outcome }}"
          echo "Push step outcome: ${{ steps.push.outcome }} (skipped means the smoke check blocked it,"
          echo "so nothing was pushed at all). Check the failing scrape step's log:"
          echo "usually GrowthZone changed the listing markup, or served an error page."
          exit 1

      # Email Mark if anything in the workflow above failed. Skips
      # silently if the notify secrets aren't configured.
      - name: Notify on failure
        if: failure()
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          CRON_ALERT_EMAIL: ${{ secrets.CRON_ALERT_EMAIL }}
        run: node scripts/notify-cron-failure.mjs
