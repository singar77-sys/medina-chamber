# Weekly data refresh — members + websites + ratings + Upstash sync + blog.
#
# All datasets are slow-moving (1–3 changes per week typically) and
# share a critical dependency on members.json — the websites and ratings
# scrapers iterate the member list, and the Upstash vector index covers
# every member. The blog scrape (src/data/blog.json) is independent of
# all of that — it's just here because "weekly" is the right cadence and
# this workflow already exists.
#
# Order of operations (do NOT rearrange steps 1-4 — everything after is
# independent and order-agnostic):
#   1. Scrape members              → writes src/data/members.json
#   2. Smoke-check the new members.json (catch broken scrapes loudly)
#   3. Scrape member websites      → writes src/data/member-websites.json
#      (must run BEFORE the vector sync — Upstash documents pull website
#       text into the embedding input)
#   4. Sync vectors to Upstash     → server-side BAAI/bge-large dense + BM25
#   5. Scrape Google ratings       → writes src/data/member-ratings.json
#   6. Scrape business blog        → writes src/data/blog.json
#   7. Commit data files together
#
# Manual run: GitHub → Actions → "Weekly data refresh" → "Run workflow"

name: Weekly data refresh

on:
  schedule:
    # Sunday 11:00 UTC = 7:00 AM ET. One run per week.
    - cron: "0 11 * * 0"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: scrape-weekly
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    # Member scrape (~5 min) + website scrape (~10 min for 466 sites)
    # + Upstash sync (~2 sec) + ratings (~3 min) + buffer.
    timeout-minutes: 45

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup pnpm
        # Version comes from package.json `packageManager` (pnpm@10.33.0); do NOT
        # add a `version:` input — pnpm/action-setup@v4 aborts on the conflict.
        uses: pnpm/action-setup@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # ── Step 1: scrape members ───────────────────────────────
      - name: Scrape member directory
        run: pnpm scrape

      # ── Step 2: smoke-check the new members.json ─────────────
      # Catches the most insidious scrape failure: GrowthZone changes their
      # HTML, our parser silently returns []. We'd push an empty members
      # file and the directory would go dark.
      - name: Smoke check — member count must be sane
        run: |
          COUNT=$(node -e "console.log(JSON.parse(require('fs').readFileSync('src/data/members.json','utf8')).members.length)")
          echo "Scraped $COUNT members"
          if [ "$COUNT" -lt 500 ]; then
            echo "❌ Member count $COUNT is below sanity floor (500). Refusing to push."
            exit 1
          fi

      # ── Step 3: scrape member websites ───────────────────────
      # Must run BEFORE the vector sync: the documents we upsert to
      # Upstash include scraped website text (services, aboutText) for
      # richer semantic matching. Stale website data → stale vectors.
      - name: Scrape member websites
        run: pnpm scrape:websites
        continue-on-error: true   # one bad website shouldn't kill the run

      # ── Step 4: sync to Upstash Vector ───────────────────────
      # Upserts every member as a fresh document. Upstash's managed
      # BAAI/bge-large-en-v1.5 (dense) + BM25 (sparse) handle vectorization
      # server-side. Idempotent — safe to re-run anytime.
      - name: Sync vectors to Upstash
        env:
          UPSTASH_VECTOR_REST_URL: ${{ secrets.UPSTASH_VECTOR_REST_URL }}
          UPSTASH_VECTOR_REST_TOKEN: ${{ secrets.UPSTASH_VECTOR_REST_TOKEN }}
        run: node scripts/sync-vectors-to-upstash.mjs

      # ── Step 5: scrape Google ratings ────────────────────────
      # Pulls Google Places ratings for each member with a website URL.
      # Independent of vector sync — safe to fail without blocking push.
      - name: Scrape Google ratings
        env:
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
        run: pnpm scrape:ratings
        continue-on-error: true

      # ── Step 6: scrape the business blog ─────────────────────
      # Independent of the member pipeline above. Was previously
      # manual-only and went stale for 3+ months (last scraped April,
      # still showing April/March posts in July) before anyone noticed.
      - name: Scrape business blog
        id: blog
        run: pnpm scrape:blog
        continue-on-error: true

      - name: Show diff (for log visibility)
        run: |
          echo "=== Files changed ==="
          git status --short
          echo ""
          echo "=== Summary ==="
          git diff --stat src/data/ || true

      - name: Commit + push if anything changed
        run: |
          if git diff --quiet src/data/; then
            echo "No data changes — nothing to commit."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/members.json \
                  src/data/member-websites.json \
                  src/data/member-ratings.json \
                  src/data/blog.json
          git commit -m "chore(data): weekly scrape — $(date -u +%Y-%m-%d)

          Auto-refresh of member directory, websites, Google ratings, and
          the business blog. Vectors synced to Upstash separately (no
          JSON file).
          Triggered by .github/workflows/scrape-weekly.yml."
          # Same intermittent receive-pack failures as the daily workflow —
          # retry with backoff, rebasing between attempts (see scrape-daily.yml).
          for attempt in 1 2 3; do
            if git push origin main; then
              echo "✓ Push succeeded on attempt $attempt"
              exit 0
            fi
            case "$attempt" in
              1) delay=10 ;;
              2) delay=30 ;;
              *) delay=0 ;;
            esac
            if [ "$delay" -gt 0 ]; then
              echo "Push attempt $attempt failed; sleeping ${delay}s before retry"
              sleep "$delay"
              git pull --rebase origin main || { echo "❌ Rebase failed; aborting"; exit 1; }
            fi
          done
          echo "❌ Push failed after 3 attempts."
          exit 1

      # Surface a blog-scrape failure AFTER the member data is safely pushed.
      # continue-on-error keeps a blog break (e.g. the Squarespace source
      # vanishing at DNS cutover) from blocking the member pipeline, but
      # without this the failure is swallowed and blog.json silently goes
      # stale — the exact staleness this workflow exists to prevent.
      - name: Fail loudly if the blog scrape broke
        if: steps.blog.outcome == 'failure'
        run: |
          echo "❌ Blog scrape failed (see the 'Scrape business blog' step). Member data was still pushed."
          exit 1

      # Email Mark if anything in the workflow above failed. Skips
      # silently if the notify secrets aren't configured.
      - name: Notify on failure
        if: failure()
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          CRON_ALERT_EMAIL: ${{ secrets.CRON_ALERT_EMAIL }}
        run: node scripts/notify-cron-failure.mjs
