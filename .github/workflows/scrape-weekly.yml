# Weekly data refresh — members + embeddings regeneration.
#
# The member directory is slow-moving (1–3 changes per week typically).
# When members.json changes, member-embeddings.json MUST be regenerated
# in the same commit, otherwise the prebuild data integrity check
# (scripts/check-data-integrity.mjs) will fail the next deploy.
#
# Order of operations is critical:
#   1. Scrape members          → writes src/data/members.json
#   2. Regenerate embeddings   → writes src/data/member-embeddings.json
#   3. Run integrity check     → bails if drift remains
#   4. Commit both files together
#
# Manual run: GitHub → Actions → "Weekly data refresh" → "Run workflow"

name: Weekly data refresh

on:
  schedule:
    # Sunday 11:00 UTC = 7:00 AM ET. One run per week.
    - cron: "0 11 * * 0"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: scrape-weekly
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30   # member scrape + 511 embedding requests is slower

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # ── Step 1: scrape members ───────────────────────────────
      - name: Scrape member directory
        run: npm run scrape

      # ── Step 2: regenerate embeddings ────────────────────────
      # Must run AFTER members.json is updated so embeddings cover the
      # new set. Cost: ~$0.001 for 511 members. Needs OPENAI_API_KEY.
      - name: Regenerate member embeddings
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: node scripts/generate-member-embeddings.mjs

      # ── Step 3: integrity gate ───────────────────────────────
      # If members.json count != embeddings count OR slugs don't match,
      # this fails the workflow and we DO NOT push. The next deploy
      # would have failed prebuild anyway; better to catch it here.
      - name: Verify members ↔ embeddings parity
        run: npm run check:data

      - name: Show diff (for log visibility)
        run: |
          echo "=== Files changed ==="
          git status --short
          echo ""
          echo "=== Summary ==="
          git diff --stat src/data/ || true

      - name: Commit + push if anything changed
        run: |
          if git diff --quiet src/data/; then
            echo "No data changes — nothing to commit."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/members.json src/data/member-embeddings.json
          git commit -m "chore(data): weekly scrape — $(date -u +%Y-%m-%d)

          Auto-refresh of member directory + regenerated embeddings.
          Triggered by .github/workflows/scrape-weekly.yml."
          git push origin main
