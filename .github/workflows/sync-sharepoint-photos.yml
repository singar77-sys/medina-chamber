# Nightly sync of the chamber's "2026 Photos" SharePoint folder
# (medinaohchamber.sharepoint.com → Shared Documents → 1 photos →
# 2026 Photos) into public/images/photos/. The exact folder list is
# in scripts/sharepoint-sync.config.json — edit that, not this YAML.
#
# Whatever changed gets committed; the commit triggers a Vercel
# rebuild and the new photos go live on the homepage Top 8 strip
# (and any other page that reads from photos/{slug}/).
#
# Manual trigger: Actions tab → "Sync SharePoint Photos" → Run workflow.
#
# Required secrets (Settings → Secrets and variables → Actions):
#   AZURE_TENANT_ID
#   AZURE_CLIENT_ID
#   AZURE_CLIENT_SECRET
#
# Azure setup the chamber's M365 admin needs to do once (Entra portal):
#   1. App registrations → New registration → "Medina Chamber Site Sync"
#   2. API permissions → Microsoft Graph → Application → Sites.Selected
#      → click "Grant admin consent"
#   3. PowerShell w/ PnP (one-time grant for the root site):
#      Grant-PnPAzureADAppSitePermission \
#        -AppId <client-id> -DisplayName "Medina Chamber Site Sync" \
#        -Site https://medinaohchamber.sharepoint.com -Permissions Read
#   4. Certificates & secrets → New client secret → copy the value
#   5. Hand the tenant ID, client ID, and secret value over to add
#      as GitHub Actions secrets

name: Sync SharePoint Photos

on:
  # No `schedule:` on purpose. The Azure app registration described above has
  # never been completed, so every nightly run since 2026-06-11 died at
  # "missing required env var AZURE_TENANT_ID" — a red job every night for
  # months, which trains everyone to ignore Actions failure mail and would
  # mask a real scrape-daily/scrape-weekly break. Restore the cron the day the
  # three AZURE_* secrets exist:
  #   schedule:
  #     # 06:00 UTC → 02:00 ET (EDT) / 01:00 ET (EST). Pre-dawn so the
  #     # site has the new images before anyone visits in the morning.
  #     - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-sharepoint-photos
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      # Fail in seconds with the actual reason, instead of after a checkout and
      # a full pnpm install, when the credentials were never provisioned.
      - name: Check Azure credentials are configured
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
        run: |
          if [ -z "$AZURE_TENANT_ID" ]; then
            echo "❌ AZURE_TENANT_ID is not set, so AZURE_CLIENT_ID/SECRET almost certainly are not either."
            echo "Finish the Entra app registration in this file's header, add the three repo secrets, then re-run."
            exit 1
          fi

      - uses: actions/checkout@v4

      # Version comes from package.json `packageManager` (pnpm@10.33.0); do NOT
      # add a `version:` input — pnpm/action-setup@v4 aborts on the conflict.
      - uses: pnpm/action-setup@v4

      # Node 24 matches the Vercel project runtime (nodeVersion 24.x);
      # Node 20 went end-of-life in April 2026.
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile

      - name: Pull photos from SharePoint
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        run: pnpm sync:sharepoint

      - name: Commit and push if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/images/photos/
          if git diff --staged --quiet; then
            echo "No photo changes — exiting clean."
            exit 0
          fi
          git commit -m "chore(photos): nightly SharePoint sync"
          # Same intermittent receive-pack failures the scrape workflows hit
          # ("fatal error in commit_refs") — retry with backoff, rebasing
          # between attempts so we don't get stuck behind a scrape commit that
          # landed during the wait. See scrape-daily.yml for the full history.
          for attempt in 1 2 3; do
            if git push origin main; then
              echo "✓ Push succeeded on attempt $attempt"
              exit 0
            fi
            case "$attempt" in
              1) delay=10 ;;
              2) delay=30 ;;
              *) delay=0 ;;
            esac
            if [ "$delay" -gt 0 ]; then
              echo "Push attempt $attempt failed; sleeping ${delay}s before retry"
              sleep "$delay"
              git pull --rebase origin main || { echo "❌ Rebase failed; aborting"; exit 1; }
            fi
          done
          echo "❌ Push failed after 3 attempts."
          exit 1
