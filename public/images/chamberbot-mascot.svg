<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 900" width="700" height="900" role="img" aria-labelledby="title desc">
  <title id="title">Animated website mascot with glasses and chest logo</title>
  <desc id="desc">A friendly cartoon mascot with blonde hair, glasses, a light shirt carrying a blue logo, and subtle idle animations.</desc>
  <defs>
    <style>
      :root{
        --ink:#2a0b24;
        --skin:#edc78d;
        --skinShadow:#d29a5d;
        --blush:#efb57a;
        --hair:#f4d67d;
        --hairMid:#e8bf61;
        --hairLight:#fff1c9;
        --shirt:#e7f3f1;
        --shirtShade:#cfe1de;
        --jeans:#2f6692;
        --logo:#071f49;
        --glass:#243146;
        --glassFill:rgba(220,245,255,.22);
        --shine:rgba(255,255,255,.78);
      }
      .stroke{stroke:var(--ink);stroke-width:8;stroke-linecap:round;stroke-linejoin:round}
      .hairStroke{stroke:var(--ink);stroke-width:8;stroke-linecap:round;stroke-linejoin:round}
      .thin{stroke:var(--ink);stroke-width:4;stroke-linecap:round;stroke-linejoin:round;fill:none}
      .float{animation:float 4.8s ease-in-out infinite}
      .hairBob{animation:hairBob 5.2s ease-in-out infinite}
      .blinkL,.blinkR{transform-box:fill-box;transform-origin:center;animation:blink 6s infinite}
      .shineMove{animation:shine 5s linear infinite}
      .logoPulse{transform-box:fill-box;transform-origin:center;animation:logoPulse 4.6s ease-in-out infinite}
      @keyframes float{
        0%,100%{transform:translateY(0)}
        50%{transform:translateY(-8px)}
      }
      @keyframes hairBob{
        0%,100%{transform:rotate(0deg) translateY(0)}
        50%{transform:rotate(.75deg) translateY(-3px)}
      }
      @keyframes blink{
        0%,44%,48%,100%{transform:scaleY(1)}
        46%{transform:scaleY(.05)}
      }
      @keyframes shine{
        0%{transform:translateX(-160px)}
        100%{transform:translateX(220px)}
      }
      @keyframes logoPulse{
        0%,100%{transform:scale(1)}
        50%{transform:scale(1.035)}
      }
    </style>
    <clipPath id="leftLensClip">
      <ellipse cx="278" cy="370" rx="54" ry="50"/>
    </clipPath>
    <clipPath id="rightLensClip">
      <ellipse cx="420" cy="370" rx="54" ry="50"/>
    </clipPath>
    <g id="mccLogo" fill="none" stroke="var(--logo)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M20 80 L63 37 H146 L189 80 L172 97 V160"/>
      <path d="M84 37 A28 28 0 0 1 126 37"/>
      <path d="M105 12 L105 2"/>
      <path d="M79 160 L79 98"/>
      <path d="M130 160 H178"/>
      <path d="M105 160 V84"/>
      <path d="M50 119 L98 95"/>
      <path d="M98 95 L98 144"/>
      <path d="M50 119 V160"/>
      <path d="M105 74 A20 20 0 0 1 128 98"/>
      <path d="M73 128 L60 115 V160"/>
      <path d="M145 111 V136"/>
      <path d="M72 59 V102"/>
      <path d="M137 59 V102"/>
      <path d="M87 96 A38 24 0 0 1 124 96"/>
    </g>
  </defs>

  <g class="float">
    <!-- hair back -->
    <g class="hairBob">
      <path class="hairStroke" fill="var(--hair)" d="M116 602
        C76 530,82 476,108 426
        C57 371,55 298,96 221
        C119 178,151 142,191 112
        C239 75,291 56,354 50
        C433 44,512 63,571 117
        C622 163,650 226,652 305
        C653 350,646 394,624 432
        C647 464,656 499,648 548
        C635 623,594 690,534 757
        C500 795,459 811,411 818
        C345 827,286 814,221 786
        C154 756,112 695,116 602 Z"/>
      <path class="thin" stroke="#deb35b" d="M165 180 C239 132,333 112,426 123"/>
      <path class="thin" stroke="#deb35b" d="M143 252 C220 205,311 183,402 193"/>
      <path class="thin" stroke="#deb35b" d="M115 588 C110 654,138 717,196 751"/>
      <path class="thin" stroke="#deb35b" d="M572 276 C601 359,598 481,551 645"/>
      <path class="thin" stroke="var(--hairLight)" d="M475 110 C548 139,596 210,606 295"/>
      <path class="thin" stroke="var(--hairLight)" d="M452 606 C478 678,466 741,431 789"/>
      <path class="thin" stroke="#deb35b" d="M244 732 C300 764,400 774,468 744"/>
    </g>

    <!-- neck -->
    <path class="stroke" fill="var(--skin)" d="M304 548 L304 606 Q350 625 396 606 L396 548 Z"/>
    <path class="thin" d="M342 560 Q350 575 358 560"/>

    <!-- head -->
    <path class="stroke" fill="var(--skin)" d="M162 225
      C194 155,262 117,350 117
      C438 117,506 155,538 225
      C555 263,560 304,555 362
      C549 439,522 494,474 530
      C437 558,395 571,350 571
      C305 571,263 558,226 530
      C178 494,151 439,145 362
      C140 304,145 263,162 225 Z"/>
    <path fill="var(--skinShadow)" d="M170 274 C186 204,244 156,305 135 C232 156,174 222,164 329 C163 310,165 292,170 274 Z"/>
    <ellipse cx="224" cy="468" rx="31" ry="22" fill="var(--blush)" opacity=".9"/>
    <ellipse cx="476" cy="468" rx="31" ry="22" fill="var(--blush)" opacity=".9"/>

    <!-- front hair -->
    <g class="hairBob">
      <path class="hairStroke" fill="var(--hair)" d="M93 239
        C150 131,253 59,373 62
        C472 64,558 113,595 192
        C603 209,607 230,608 251
        C593 224,569 204,539 194
        C510 184,469 185,431 192
        C384 201,345 217,293 216
        C230 214,169 216,93 239 Z"/>
      <path class="hairStroke" fill="var(--hair)" d="M95 242
        C134 214,181 185,240 150
        C315 106,377 91,447 110
        C488 121,521 145,541 182
        C515 150,476 140,437 144
        C390 149,351 168,299 188
        C242 210,179 229,95 242 Z"/>
      <path class="hairStroke" fill="var(--hair)" d="M403 96
        C483 104,550 138,589 201
        C604 225,612 250,611 280
        C596 243,567 211,529 194
        C493 179,446 176,407 183
        C440 166,453 131,403 96 Z"/>
      <path class="thin" stroke="#deb35b" d="M143 231 C232 178,332 142,432 146"/>
      <path class="thin" stroke="#deb35b" d="M269 151 C332 134,409 137,468 157"/>
      <path class="thin" stroke="var(--hairLight)" d="M450 122 C514 136,563 170,589 219"/>
      <path class="thin" stroke="var(--hairLight)" d="M121 267 C197 233,270 216,343 214"/>
    </g>

    <!-- ears -->
    <path class="stroke" fill="var(--skin)" d="M146 348 C112 356,103 401,126 425 C145 445,178 439,187 415 C198 385,183 352,146 348 Z"/>
    <path class="stroke" fill="var(--skin)" d="M554 348 C588 356,597 401,574 425 C555 445,522 439,513 415 C502 385,517 352,554 348 Z"/>
    <path class="thin" d="M138 392 Q151 387 159 399"/>
    <path class="thin" d="M563 392 Q550 387 542 399"/>

    <!-- brows -->
    <path class="stroke" fill="none" d="M224 305 Q264 288 297 302"/>
    <path class="stroke" fill="none" d="M403 302 Q436 288 476 305"/>

    <!-- eyes -->
    <g>
      <g class="blinkL">
        <ellipse cx="278" cy="370" rx="48" ry="58" fill="#fff" class="stroke"/>
        <ellipse cx="288" cy="376" rx="26" ry="33" fill="#2b0c28"/>
        <ellipse cx="282" cy="387" rx="14" ry="17" fill="#bfe8ea"/>
        <ellipse cx="270" cy="352" rx="11" ry="16" fill="#fff"/>
      </g>
      <g class="blinkR">
        <ellipse cx="420" cy="370" rx="48" ry="58" fill="#fff" class="stroke"/>
        <ellipse cx="430" cy="376" rx="26" ry="33" fill="#2b0c28"/>
        <ellipse cx="424" cy="387" rx="14" ry="17" fill="#bfe8ea"/>
        <ellipse cx="412" cy="352" rx="11" ry="16" fill="#fff"/>
      </g>
      <path class="thin" d="M231 352 Q214 366 218 390"/>
      <path class="thin" d="M467 352 Q484 366 480 390"/>
      <path class="thin" d="M233 416 Q278 430 319 414"/>
      <path class="thin" d="M381 414 Q422 430 467 416"/>
    </g>

    <!-- glasses -->
    <g>
      <ellipse cx="278" cy="370" rx="58" ry="54" fill="var(--glassFill)" stroke="var(--glass)" stroke-width="8"/>
      <ellipse cx="420" cy="370" rx="58" ry="54" fill="var(--glassFill)" stroke="var(--glass)" stroke-width="8"/>
      <path d="M336 369 H362" stroke="var(--glass)" stroke-width="8" stroke-linecap="round"/>
      <path d="M220 364 C188 354 175 350 160 355" stroke="var(--glass)" stroke-width="8" stroke-linecap="round" fill="none"/>
      <path d="M478 364 C510 354 523 350 538 355" stroke="var(--glass)" stroke-width="8" stroke-linecap="round" fill="none"/>
      <g clip-path="url(#leftLensClip)">
        <rect class="shineMove" x="200" y="300" width="28" height="140" fill="var(--shine)" opacity=".55" transform="rotate(20 214 370)"/>
      </g>
      <g clip-path="url(#rightLensClip)">
        <rect class="shineMove" x="330" y="300" width="28" height="140" fill="var(--shine)" opacity=".55" transform="rotate(20 344 370)"/>
      </g>
    </g>

    <!-- nose and mouth -->
    <path class="stroke" fill="none" d="M341 430 Q331 435 333 448 Q344 452 355 449"/>
    <path class="stroke" fill="none" d="M273 477 Q350 504 427 477"/>
    <path class="thin" d="M295 485 Q350 499 405 485"/>

    <!-- shirt -->
    <path class="stroke" fill="var(--shirt)" d="M223 601
      C243 575,278 565,307 561
      C328 572,372 572,393 561
      C422 565,457 575,477 601
      L505 769
      C458 789,404 799,350 799
      C296 799,242 789,195 769 Z"/>
    <path class="stroke" fill="var(--shirt)" d="M203 620
      C176 642,164 673,157 713
      L146 819
      L199 819
      L214 732
      C219 704,227 672,240 648 Z"/>
    <path class="stroke" fill="var(--shirt)" d="M497 620
      C524 642,536 673,543 713
      L554 819
      L501 819
      L486 732
      C481 704,473 672,460 648 Z"/>
    <path class="thin" d="M245 672 Q286 690 314 668"/>
    <path class="thin" d="M454 672 Q413 690 385 668"/>
    <path class="thin" d="M268 744 Q347 769 432 744"/>
    <path class="stroke" fill="none" d="M302 567 Q350 590 398 567"/>
    <path class="thin" d="M274 706 Q350 736 426 706"/>

    <!-- logo on shirt -->
    <g class="logoPulse" transform="translate(284 620) scale(.72)">
      <use href="#mccLogo"/>
    </g>

    <!-- arms -->
    <path class="stroke" fill="var(--skin)" d="M170 693 C154 718,145 751,142 788 L140 879 L182 879 L191 789 C194 755,201 725,216 699 Z"/>
    <path class="stroke" fill="var(--skin)" d="M530 693 C546 718,555 751,558 788 L560 879 L518 879 L509 789 C506 755,499 725,484 699 Z"/>

    <!-- pants hint -->
    <path class="stroke" fill="var(--jeans)" d="M281 799 H419 L427 900 H273 Z" opacity=".88"/>
  </g>
</svg>