# Weekly data refresh — members + embeddings + websites + ratings.
#
# All four datasets are slow-moving (1–3 changes per week typically) and
# share a critical dependency on members.json — the websites and ratings
# scrapers iterate the member list, and the embeddings cover every member.
#
# Order of operations (do NOT rearrange):
#   1. Smoke-check the existing members.json before we start
#   2. Scrape members              → writes src/data/members.json
#   3. Smoke-check the new members.json (catch broken scrapes loudly)
#   4. Regenerate embeddings       → writes src/data/member-embeddings.json
#   5. Run the integrity check     → bails if drift remains
#   6. Scrape member websites      → writes src/data/member-websites.json
#   7. Scrape Google ratings       → writes src/data/member-ratings.json
#   8. Commit all four data files together
#
# Manual run: GitHub → Actions → "Weekly data refresh" → "Run workflow"

name: Weekly data refresh

on:
  schedule:
    # Sunday 11:00 UTC = 7:00 AM ET. One run per week.
    - cron: "0 11 * * 0"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: scrape-weekly
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    # Member scrape (~5 min) + 511 embeddings (~3 min) + website scrape
    # (~10 min for 466 sites) + ratings (~3 min) + buffer.
    timeout-minutes: 45

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # ── Step 1: scrape members ───────────────────────────────
      - name: Scrape member directory
        run: npm run scrape

      # ── Step 2: smoke-check the new members.json ─────────────
      # Catches the most insidious scrape failure: GrowthZone changes their
      # HTML, our parser silently returns []. We'd push an empty members
      # file and the directory would go dark.
      - name: Smoke check — member count must be sane
        run: |
          COUNT=$(node -e "console.log(JSON.parse(require('fs').readFileSync('src/data/members.json','utf8')).members.length)")
          echo "Scraped $COUNT members"
          if [ "$COUNT" -lt 500 ]; then
            echo "❌ Member count $COUNT is below sanity floor (500). Refusing to push."
            exit 1
          fi

      # ── Step 3: regenerate embeddings ────────────────────────
      # Must run AFTER members.json is updated so embeddings cover the
      # new set. Cost: ~$0.001 for 511 members. Needs OPENAI_API_KEY.
      - name: Regenerate member embeddings
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: node scripts/generate-member-embeddings.mjs

      # ── Step 4: integrity gate ───────────────────────────────
      # If members.json count != embeddings count OR slugs don't match,
      # this fails the workflow and we DO NOT push. The next deploy
      # would have failed prebuild anyway; better to catch it here.
      - name: Verify members ↔ embeddings parity
        run: npm run check:data

      # ── Step 5: scrape member websites ───────────────────────
      # Iterates every member with a website URL, fetches their homepage,
      # extracts about-text/services for ChamberBot context enrichment.
      # No auth needed — public pages.
      - name: Scrape member websites
        run: npm run scrape:websites
        continue-on-error: true   # one bad website shouldn't kill the run

      # ── Step 6: scrape Google ratings ────────────────────────
      # Pulls Google Places ratings for each member with a website URL.
      # Needs GOOGLE_PLACES_API_KEY.
      - name: Scrape Google ratings
        env:
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
        run: npm run scrape:ratings
        continue-on-error: true

      - name: Show diff (for log visibility)
        run: |
          echo "=== Files changed ==="
          git status --short
          echo ""
          echo "=== Summary ==="
          git diff --stat src/data/ || true

      - name: Commit + push if anything changed
        run: |
          if git diff --quiet src/data/; then
            echo "No data changes — nothing to commit."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/members.json \
                  src/data/member-embeddings.json \
                  src/data/member-websites.json \
                  src/data/member-ratings.json
          git commit -m "chore(data): weekly scrape — $(date -u +%Y-%m-%d)

          Auto-refresh of member directory, embeddings, websites, and
          Google ratings. Triggered by .github/workflows/scrape-weekly.yml."
          git push origin main
