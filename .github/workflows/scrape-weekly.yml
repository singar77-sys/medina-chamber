# Weekly data refresh — members + websites + ratings + Upstash sync + blog.
#
# All datasets are slow-moving (1–3 changes per week typically) and
# share a critical dependency on members.json — the websites and ratings
# scrapers iterate the member list, and the Upstash vector index covers
# every member. The blog scrape (src/data/blog.json) is independent of
# all of that — it's just here because "weekly" is the right cadence and
# this workflow already exists.
#
# Order of operations (steps 1-3 are order-dependent; 4-5 are independent):
#   1. Scrape members              → writes src/data/members.json
#   2. Smoke-check the new members.json (catch broken scrapes loudly)
#   3. Scrape member websites      → writes src/data/member-websites.json
#      (must run BEFORE the vector sync — Upstash documents pull website
#       text into the embedding input)
#   4. Scrape Google ratings       → writes src/data/member-ratings.json
#   5. Scrape business blog        → writes src/data/blog.json
#   6. Quality gate (typecheck + tests + build) — CI cannot run on the
#      commit this job makes, so the gate has to run before the push
#   7. Commit + push the data files together
#   8. Sync vectors to Upstash (server-side BAAI/bge-large dense + BM25)
#      — LAST, and deliberately so. It is the only step here that writes
#      to LIVE PRODUCTION; if it ran before the gate/push, an abort would
#      leave the search index holding members that members.json never
#      received, which is the "flashes then vanishes / unsearchable"
#      divergence this repo has hit before.
#
# Manual run: GitHub → Actions → "Weekly data refresh" → "Run workflow"

name: Weekly data refresh

on:
  schedule:
    # Sunday 11:00 UTC = 7:00 AM ET. One run per week.
    - cron: "0 11 * * 0"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: scrape-weekly
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    # Member scrape (~5 min) + website scrape (~10 min for 466 sites)
    # + Upstash sync (~2 sec) + ratings (~3 min) + the pre-push quality gate
    # (typecheck + vitest + `next build`, ~4 min) + buffer.
    timeout-minutes: 60

    steps:
      # Pinned to a full commit SHA rather than the mutable `@v4` tag — see
      # ci.yml for the rationale. Bump SHA and version comment together.
      - name: Checkout main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # actions/checkout's default token, spelled out. A push made with it
          # never retriggers Actions (GitHub blocks that to stop workflow
          # loops), so CI does not run on the commit below — hence the
          # pre-push quality gate further down.
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup pnpm
        # Version comes from package.json `packageManager` (pnpm@10.33.0); do NOT
        # add a `version:` input — pnpm/action-setup aborts on the conflict.
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      # Node 24 matches the Vercel project runtime (nodeVersion 24.x);
      # Node 20 went end-of-life in April 2026.
      - name: Set up Node 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # ── Step 1: scrape members ───────────────────────────────
      - name: Scrape member directory
        run: pnpm scrape

      # ── Step 2: smoke-check the new members.json ─────────────
      # Catches the most insidious scrape failure: GrowthZone changes their
      # HTML, our parser silently returns []. We'd push an empty members
      # file and the directory would go dark.
      - name: Smoke check — member count must be sane
        run: |
          COUNT=$(node -e "console.log(JSON.parse(require('fs').readFileSync('src/data/members.json','utf8')).members.length)")
          echo "Scraped $COUNT members"
          # Floor 450, not 500: real membership drifted to 501 by 2026-08 and a
          # hard 500 was one departure from bricking every weekly refresh. The
          # catastrophic-collapse case is covered by the scraper's own guard
          # (refuses to write on a >10% drop vs the previous file).
          if [ "$COUNT" -lt 450 ]; then
            echo "❌ Member count $COUNT is below sanity floor (450). Refusing to push."
            exit 1
          fi

      # ── Step 3: scrape member websites ───────────────────────
      # Must run BEFORE the vector sync: the documents we upsert to
      # Upstash include scraped website text (services, aboutText) for
      # richer semantic matching. Stale website data → stale vectors.
      - name: Scrape member websites
        run: pnpm scrape:websites
        continue-on-error: true   # one bad website shouldn't kill the run

      # ── Step 4: scrape Google ratings ────────────────────────
      # Pulls Google Places ratings for each member with a website URL.
      # Independent of vector sync — safe to fail without blocking push.
      - name: Scrape Google ratings
        id: ratings
        env:
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
        run: pnpm scrape:ratings
        continue-on-error: true

      # ── Step 5: scrape the business blog ─────────────────────
      # Independent of the member pipeline above. Was previously
      # manual-only and went stale for 3+ months (last scraped April,
      # still showing April/March posts in July) before anyone noticed.
      - name: Scrape business blog
        id: blog
        run: pnpm scrape:blog
        continue-on-error: true

      # ── Quality gate — MUST run here, before the push ────────
      # The push below authenticates with the default GITHUB_TOKEN, which by
      # design never retriggers workflows — so ci.yml does NOT run on these
      # commits. Vercel deploys them anyway (its own GitHub App watches the
      # repo, not Actions), which means this step is the only thing standing
      # between a bad scrape and production.
      #
      # The commits are path-scoped to src/data/*.json, so the risk is bad
      # DATA breaking the build or the rendered pages, not untrusted code —
      # typecheck + tests + a real production build is exactly that check.
      # Run in-job rather than via a bot PR because the refresh has to land
      # unattended; a stalled PR means the directory silently goes stale.
      - name: Quality gate — scraped data must still typecheck, test and build
        run: |
          if git diff --quiet src/data/; then
            echo "No data changes — nothing will be pushed, skipping the gate."
            exit 0
          fi
          pnpm exec tsc --noEmit
          pnpm test
          pnpm build

      - name: Show diff (for log visibility)
        run: |
          echo "=== Files changed ==="
          git status --short
          echo ""
          echo "=== Summary ==="
          git diff --stat src/data/ || true

      - name: Commit + push if anything changed
        id: push
        run: |
          if git diff --quiet src/data/; then
            echo "No data changes — nothing to commit."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/members.json \
                  src/data/member-websites.json \
                  src/data/member-ratings.json \
                  src/data/blog.json
          git commit -m "chore(data): weekly scrape — $(date -u +%Y-%m-%d)

          Auto-refresh of member directory, websites, Google ratings, and
          the business blog. Vectors synced to Upstash separately (no
          JSON file).
          Triggered by .github/workflows/scrape-weekly.yml."
          # Same intermittent receive-pack failures as the daily workflow —
          # retry with backoff, rebasing between attempts (see scrape-daily.yml).
          for attempt in 1 2 3; do
            if git push origin main; then
              echo "✓ Push succeeded on attempt $attempt"
              exit 0
            fi
            case "$attempt" in
              1) delay=10 ;;
              2) delay=30 ;;
              *) delay=0 ;;
            esac
            if [ "$delay" -gt 0 ]; then
              echo "Push attempt $attempt failed; sleeping ${delay}s before retry"
              sleep "$delay"
              git pull --rebase origin main || { echo "❌ Rebase failed; aborting"; exit 1; }
            fi
          done
          echo "❌ Push failed after 3 attempts."
          exit 1

      # ── Sync vectors to Upstash — AFTER the push, deliberately ──
      # This is the only step in the job that writes to LIVE PRODUCTION;
      # everything above it touches nothing but the runner's working tree.
      # So it runs last, and the index can never get ahead of what actually
      # shipped: if the quality gate fails, or the push fails, this step is
      # skipped (no `if:`, so the implicit success() applies) and the index
      # keeps last week's members — which still match the members.json that
      # is live.
      #
      # Direction matters. Index BEHIND members.json = a brand-new member
      # renders in the directory but is missing from semantic search until
      # the next run: visible, recoverable, one re-run away. Index AHEAD =
      # a member in the index that members.json does not have, whose card
      # "flashes then vanishes" and whose entry is unsearchable. Never
      # trade the first for the second. (The script also DELETES departed
      # members' vectors, so running it early could equally have removed
      # members the shipped file still contains.)
      #
      # Reads src/data/members.json + member-websites.json off disk — the
      # push does not touch the working tree, so they are still the files
      # the gate just validated. Not conditioned on a data diff: the sync
      # is idempotent and re-running it weekly is also what repairs an
      # index that has drifted for any other reason.
      #
      # Retried, then LOUD. A failure here is never swallowed: after 3
      # attempts the step fails the job (and the notify step below emails),
      # because a silently skipped sync is exactly how the index goes stale
      # without anyone noticing.
      - name: Sync vectors to Upstash
        env:
          UPSTASH_VECTOR_REST_URL: ${{ secrets.UPSTASH_VECTOR_REST_URL }}
          UPSTASH_VECTOR_REST_TOKEN: ${{ secrets.UPSTASH_VECTOR_REST_TOKEN }}
        run: |
          for attempt in 1 2 3; do
            if node scripts/sync-vectors-to-upstash.mjs; then
              echo "✓ Vector sync succeeded on attempt $attempt"
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "Vector sync attempt $attempt failed; sleeping 15s before retry"
              sleep 15
            fi
          done
          echo "❌ Vector sync failed after 3 attempts."
          echo "members.json HAS been pushed, so the search index is now BEHIND the live"
          echo "data: members added this week render in the directory but will not come"
          echo "back from search. Re-run this workflow, or run"
          echo "  node scripts/sync-vectors-to-upstash.mjs"
          echo "locally with UPSTASH_VECTOR_REST_URL / _TOKEN set."
          exit 1

      # Surface a blog-scrape failure AFTER the member data is safely pushed.
      # continue-on-error keeps a blog break (e.g. the Squarespace source
      # vanishing at DNS cutover) from blocking the member pipeline, but
      # without this the failure is swallowed and blog.json silently goes
      # stale — the exact staleness this workflow exists to prevent.
      - name: Fail loudly if the blog scrape broke
        if: always() && steps.blog.outcome == 'failure'
        run: |
          echo "❌ Blog scrape failed (see the 'Scrape business blog' step). Push step outcome: ${{ steps.push.outcome }}."
          exit 1

      # Same reason as the blog step above. The ratings scrape exits 1 before
      # saving when GOOGLE_PLACES_API_KEY is missing or the key comes back
      # REQUEST_DENIED, and continue-on-error swallowed it — member-ratings.json
      # went stale from June 2026 onward with every run still green, so members
      # who joined after that never got a Google rating badge.
      - name: Fail loudly if the ratings scrape broke
        if: always() && steps.ratings.outcome == 'failure'
        run: |
          echo "❌ Google ratings scrape failed (see the 'Scrape Google ratings' step). Push step outcome: ${{ steps.push.outcome }}."
          echo "Usual cause: the GOOGLE_PLACES_API_KEY repo secret is missing, expired, or the Places API is disabled on the key."
          exit 1

      # Email Mark if anything in the workflow above failed. Skips
      # silently if the notify secrets aren't configured.
      - name: Notify on failure
        if: failure()
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          CRON_ALERT_EMAIL: ${{ secrets.CRON_ALERT_EMAIL }}
        run: node scripts/notify-cron-failure.mjs
